name: Build Accumulo from source

on:
  workflow_dispatch:
    inputs:
      accumuloRepo:
        description: GitHub repository containing Accumulo
        type: string
        default: apache/accumulo
      accumuloBranch:
        description: Accumulo branch, tag or commit
        type: string
        default: '2.1'
      java:
        description: Runtime Java version (must be supported by the selected source)
        type: choice
        options: [both, '11', '17']
        default: both
      build_java:
        description: JDK used by Maven (independent of image runtime)
        type: choice
        options: ['17', '11']
        default: '17'
      destination:
        description: Publish destination (all builds run self-hosted)
        type: choice
        options: [ghcr, private, both]
        default: ghcr
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: accumulo-source-${{ github.ref }}-${{ inputs.accumuloBranch || '2.1' }}-${{ inputs.destination || 'automatic' }}
  cancel-in-progress: false

jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJSON(inputs.java == '11' && '["11"]' || inputs.java == '17' && '["17"]' || '["11","17"]') }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      java: ${{ matrix.java }}
      runner_labels: ${{ vars.IMAGE_RUNNER_LABELS || '["self-hosted","linux","x64"]' }}
      destination: ${{ inputs.destination || (vars.SELF_HOSTED_REGISTRY != '' && 'both' || 'ghcr') }}
      source_repository: ${{ inputs.accumuloRepo || 'apache/accumulo' }}
      source_ref: ${{ inputs.accumuloBranch || '2.1' }}
      build_java: ${{ inputs.build_java || '17' }}
    secrets: inherit
