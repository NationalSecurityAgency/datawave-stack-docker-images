name: Build release images

on:
  push:
    branches: [main]
    paths:
      - 'datawave-base/**'
      - 'datawave-hadoop/**'
      - 'datawave-accumulo/**'
      - 'build/**'
      - 'scripts/**'
      - '.github/workflows/**'
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      java:
        description: Runtime Java version
        type: choice
        options: [both, '11', '17']
        default: both
      destination:
        description: Publish destination (all builds run self-hosted)
        type: choice
        options: [ghcr, private, both]
        default: ghcr
      tag:
        description: Optional tag prefix (defaults to the Accumulo release version)
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}-${{ inputs.destination || 'automatic' }}
  cancel-in-progress: false

jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJSON(inputs.java == '11' && '["11"]' || inputs.java == '17' && '["17"]' || '["11","17"]') }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      java: ${{ matrix.java }}
      runner_labels: ${{ vars.IMAGE_RUNNER_LABELS || '["self-hosted","linux","x64"]' }}
      destination: ${{ inputs.destination || (vars.SELF_HOSTED_REGISTRY != '' && 'both' || 'ghcr') }}
      tag: ${{ inputs.tag || '' }}
    secrets: inherit
