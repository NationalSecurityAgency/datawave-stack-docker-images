name: Build and verify stack images

on:
  workflow_call:
    inputs:
      java:
        type: string
        required: true
      runner_labels:
        type: string
        default: '["self-hosted","linux","x64"]'
      destination:
        type: string
        default: ghcr
      tag:
        type: string
        default: ''
      source_repository:
        type: string
        default: ''
      source_ref:
        type: string
        default: '2.1'
    secrets:
      HADOOP_REPO_CONFIG:
        required: false
      CY_ROBOT_ACCOUNT_USER:
        required: false
      CY_ROBOT_ACCOUNT_SECRET:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 90
    # Serialize release and source builds that publish the same parent tags.
    concurrency:
      group: stack-publish-java${{ inputs.java }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate configuration
        env:
          DESTINATION: ${{ inputs.destination }}
          PRIVATE_REGISTRY: ${{ vars.SELF_HOSTED_REGISTRY }}
          PRIVATE_REGISTRY_ROOT: ${{ vars.SELF_HOSTED_REGISTRY_ROOT }}
          PRIVATE_USER: ${{ secrets.CY_ROBOT_ACCOUNT_USER }}
          PRIVATE_PASSWORD: ${{ secrets.CY_ROBOT_ACCOUNT_SECRET }}
          HADOOP_REPO_CONFIG: ${{ secrets.HADOOP_REPO_CONFIG }}
        run: |
          case "$DESTINATION" in ghcr|private|both) ;; *) exit 1 ;; esac
          if [[ "$DESTINATION" != ghcr ]]; then
            test -n "$PRIVATE_REGISTRY"
            test -n "$PRIVATE_REGISTRY_ROOT"
            test -n "$PRIVATE_USER"
            test -n "$PRIVATE_PASSWORD"
          fi
          test -n "$HADOOP_REPO_CONFIG" || {
            echo 'Configure the HADOOP_REPO_CONFIG Actions secret with the complete yum repo file.'
            exit 1
          }
      - name: Checkout Accumulo source
        if: inputs.source_repository != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          path: .build/accumulo
          persist-credentials: false
      - name: Set up JDK 21 for Accumulo compilation
        if: inputs.source_repository != ''
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
          cache-dependency-path: .build/accumulo/**/pom.xml
      - name: Build Accumulo distribution
        if: inputs.source_repository != ''
        working-directory: .build/accumulo
        run: |
          mvn -B -ntp -DskipTests clean package
          mvn -B -ntp -q help:evaluate -Dexpression=project.version -Doutput="$RUNNER_TEMP/accumulo-version"
          version=$(<"$RUNNER_TEMP/accumulo-version")
          archive="assemble/target/accumulo-${version}-bin.tar.gz"
          test -f "$archive"
          cp "$archive" "$GITHUB_WORKSPACE/datawave-accumulo/files/"
          echo "ACCUMULO_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "ACCUMULO_BUILD_TAG=${version}-dwv-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: inputs.destination == 'ghcr' || inputs.destination == 'both'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to private registry
        if: inputs.destination == 'private' || inputs.destination == 'both'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.SELF_HOSTED_REGISTRY_ROOT }}
          username: ${{ secrets.CY_ROBOT_ACCOUNT_USER }}
          password: ${{ secrets.CY_ROBOT_ACCOUNT_SECRET }}
      - name: Build, smoke test and publish
        env:
          JAVA_VERSION: ${{ inputs.java }}
          DESTINATION: ${{ inputs.destination }}
          PRIVATE_REGISTRY: ${{ vars.SELF_HOSTED_REGISTRY }}
          IMAGE_TAG: ${{ inputs.tag }}
          HADOOP_REPO_CONFIG: ${{ secrets.HADOOP_REPO_CONFIG }}
        run: |
          args=(--java "$JAVA_VERSION" --hadoop-source repo --push
                --revision "$GITHUB_SHA")
          if [[ "$DESTINATION" == ghcr || "$DESTINATION" == both ]]; then
            args+=(--registry ghcr.io/nationalsecurityagency)
          fi
          if [[ "$DESTINATION" == private || "$DESTINATION" == both ]]; then
            args+=(--registry "$PRIVATE_REGISTRY")
          fi
          if [[ -n "${ACCUMULO_BUILD_VERSION:-}" ]]; then
            args+=(--accumulo-version "$ACCUMULO_BUILD_VERSION" --tag "$ACCUMULO_BUILD_TAG")
          elif [[ -n "$IMAGE_TAG" ]]; then
            args+=(--tag "$IMAGE_TAG")
          fi
          python3 scripts/build-images.py "${args[@]}"
