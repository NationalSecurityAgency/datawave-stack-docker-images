name: Validate build automation
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - name: Check build behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n datawave-hadoop/install-hadoop.sh datawave-hadoop/build-local.sh datawave-accumulo/conf/accumulo-env.sh
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Verify Hadoop context excludes private files
        run: python3 scripts/check-hadoop-build-context.py
      - name: Validate generated Bake configuration
        env:
          HADOOP_REPO_CONFIG: synthetic-repo-configuration
        run: |
          python3 scripts/build-images.py --print > "$RUNNER_TEMP/bake.json"
          docker buildx bake -f "$RUNNER_TEMP/bake.json" --print
